name: Build PKG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis-PS4-Toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make cmake python3 python3-pip git zip unzip

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get OpenOrbis toolchain
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$OO_PS4_TOOLCHAIN"

      - name: Build
        run: |
          if [ -f build.sh ]; then chmod +x build.sh && ./build.sh
          elif [ -f Makefile ]; then make -j$(nproc)
          elif [ -f launcher/build.sh ]; then cd launcher && chmod +x build.sh && ./build.sh
          elif [ -f launcher/Makefile ]; then make -C launcher -j$(nproc)
          else echo "No build script found"; ls -R | head -100; exit 1; fi

      - name: List outputs
        run: find . -name "*.pkg" -o -name "*.elf" -o -name "*.bin"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: jkflow-pkg
          path: |
            **/*.pkg
            **/*.elf
          if-no-files-found: warn
