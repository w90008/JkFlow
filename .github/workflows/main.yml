name: Build PKG

# Zero-input PKG build.
#
#   pull_request        host tests only
#   push (main)         host tests, then the PKG job
#   push tag v*         same, and the PKG is attached to the tag's release
#   workflow_dispatch   same; the inputs below only override the defaults
#
# The real build needs the JkFlow build root: the Blur game files, the AMAX
# and blur_12 zips, the DXVK state cache and the prebuilt Wine modules. Those
# are copyrighted and are not in this repository, so the job finds the root
# itself, in this order:
#
#   1. the workflow_dispatch input build_root_url
#   2. the repository variable JKFLOW_BUILD_ROOT_URL (a direct .tar.zst URL)
#   3. a release asset named jkflow-build-root*.tar.zst, newest release first,
#      in this repository and then in JKFLOW_UPSTREAM_REPO (default
#      Salru13/JkFlow)
#
# The archive's top folder may be `build-root/` or any single folder with the
# layout below. When a root is found the job runs the title tests,
# title/make_package_inputs.sh and title/make_pkg.sh.
#
# When no root is found the job does not fail: it extracts the newest published
# JkFlow-*.pkg (this repository, then JKFLOW_UPSTREAM_REPO), keeps its
# param.sfo and rebuilds the .pkg with this repository's pipeline, naming it
# JkFlow-<version>-repacked.pkg. Upload the root once as a release asset and
# every later run is a real build. JKFLOW_SOURCE_PKG_URL overrides the repack
# source.
#
# Expected folders in the build root (pinned by title/make_package_inputs.sh):
#   blur-launcher-r4           prepared title tree, already built
#   blur100-inventory/         order-284 package (uroot)
#   native294-package268/      V7/S7/dxvk.conf of the 0.8.33 package
#   blur100-paths6/            path-cleaned modules, PE tree and seed
#   blur100-paths6b/           path-cleaned modules (dev env files)
#   blur100-paths7/            post-link devpaths modules
#   jkflow100-engine-product/  dxvknative.prx and d3d9.c988.dll
#   blur100-wow/               wow64.dll and wowblur.dll
#   inputs/amax_client_files.zip
#   inputs/blur_12.zip
#   inputs/dxvk-native.dxvk-cache

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (blank = tag without "v", else JKFLOW_VERSION, else 1.00)
        required: false
        default: ""
      app_version:
        description: APP_VER/VERSION in param.sfo (blank = JKFLOW_APP_VERSION, else 01.00)
        required: false
        default: ""
      build_root_url:
        description: Direct URL of a jkflow-build-root tar.zst (blank = auto-discover)
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: build-pkg-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: ${{ vars.JKFLOW_UPSTREAM_REPO || 'Salru13/JkFlow' }}
  DEFAULT_VERSION: ${{ vars.JKFLOW_VERSION || '1.00' }}
  DEFAULT_APP_VERSION: ${{ vars.JKFLOW_APP_VERSION || '01.00' }}
  PKGTOOL_COMMIT: 92a4e7f8e5914cb06b52ba3ae6b0675da438a051
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfreetype-dev

      - name: Python syntax
        run: python3 -m compileall -q title launcher/tools

      - name: Shell syntax
        run: |
          find title launcher wine/build -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Launcher host tests
        run: bash launcher/tests/run.sh

      - name: Title tool selftests
        run: |
          python3 -I title/postlink_clean.py selftest
          python3 -I title/tests/test_make_gp4.py

  build-pkg:
    name: Build JkFlow PKG
    needs: host-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfreetype-dev zstd

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache PkgTool.Core
        uses: actions/cache@v6
        with:
          path: ~/.cache/jkflow-pkgtool
          key: pkgtool-${{ runner.os }}-${{ env.PKGTOOL_COMMIT }}

      - name: Build PkgTool.Core (LibOrbisPkg, pinned)
        run: |
          set -euo pipefail
          dest="$HOME/.cache/jkflow-pkgtool"
          if [ ! -f "$dest/PkgTool.Core.dll" ]; then
            rm -rf "$dest"
            git clone --quiet https://github.com/OpenOrbis/LibOrbisPkg.git "$RUNNER_TEMP/LibOrbisPkg"
            git -C "$RUNNER_TEMP/LibOrbisPkg" checkout --quiet "$PKGTOOL_COMMIT"
            dotnet build -c Release --nologo \
              "$RUNNER_TEMP/LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj" \
              -o "$dest"
          fi
          test -f "$dest/PkgTool.Core.dll"
          echo "PS4_PKGTOOL=$dest/PkgTool.Core.dll" >> "$GITHUB_ENV"

      - name: Resolve version and inputs
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
          INPUT_ROOT_URL: ${{ github.event.inputs.build_root_url }}
          ROOT_URL_VAR: ${{ vars.JKFLOW_BUILD_ROOT_URL }}
        run: |
          set -euo pipefail

          api() {
            if command -v gh >/dev/null 2>&1 && gh api "$1" 2>/dev/null; then
              return 0
            fi
            local args=(-fsSL -H 'Accept: application/vnd.github+json')
            [ -z "${GITHUB_TOKEN:-}" ] || args+=(-H "Authorization: Bearer $GITHUB_TOKEN")
            curl "${args[@]}" "https://api.github.com/$1"
          }

          # Print "<tag>\t<asset>" for the newest release that has a matching
          # asset. Exit status is 0 with no output when there is none.
          pick_asset() {
            python3 -c '
          import json, sys
          prefix, suffix = sys.argv[1], sys.argv[2]
          try:
              releases = json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)
          for rel in releases:
              for asset in rel.get("assets") or []:
                  name = asset.get("name", "")
                  if name.startswith(prefix) and name.endswith(suffix):
                      print(rel.get("tag_name", "") + "\t" + name)
                      raise SystemExit(0)
          ' "$1" "$2"
          }

          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$version" ] || version="$DEFAULT_VERSION"

          app_version="${INPUT_APP_VERSION:-}"
          [ -n "$app_version" ] || app_version="$DEFAULT_APP_VERSION"

          root_url="${INPUT_ROOT_URL:-}"
          [ -n "$root_url" ] || root_url="${ROOT_URL_VAR:-}"

          mode=repack
          root_repo="" root_tag="" root_asset=""
          pkg_repo="" pkg_tag="" pkg_asset=""

          if [ -n "$root_url" ]; then
            mode=build
            echo "build root: $root_url"
          else
            for repo in "$GITHUB_REPOSITORY" "$UPSTREAM_REPO"; do
              found="$(api "repos/$repo/releases?per_page=100" | pick_asset jkflow-build-root .tar.zst || true)"
              [ -n "$found" ] || continue
              root_repo="$repo"
              root_tag="${found%%$'\t'*}"
              root_asset="${found#*$'\t'}"
              mode=build
              break
            done
          fi

          if [ "$mode" = repack ]; then
            for repo in "$GITHUB_REPOSITORY" "$UPSTREAM_REPO"; do
              found="$(api "repos/$repo/releases?per_page=100" | pick_asset JkFlow- .pkg || true)"
              [ -n "$found" ] || continue
              pkg_repo="$repo"
              pkg_tag="${found%%$'\t'*}"
              pkg_asset="${found#*$'\t'}"
              break
            done
          fi

          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "mode=$mode"
            echo "root_url=$root_url"
            echo "root_repo=$root_repo"
            echo "root_tag=$root_tag"
            echo "root_asset=$root_asset"
            echo "pkg_repo=$pkg_repo"
            echo "pkg_tag=$pkg_tag"
            echo "pkg_asset=$pkg_asset"
          } >> "$GITHUB_OUTPUT"

          echo "version=$version app_version=$app_version mode=$mode"
          echo "build root: ${root_repo:-<url>}${root_tag:+@$root_tag}${root_asset:+/$root_asset}"
          echo "repack source: ${pkg_repo}${pkg_tag:+@$pkg_tag}${pkg_asset:+/$pkg_asset}"

      - name: Restore build root
        if: steps.resolve.outputs.mode == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_URL: ${{ steps.resolve.outputs.root_url }}
          ROOT_REPO: ${{ steps.resolve.outputs.root_repo }}
          ROOT_TAG: ${{ steps.resolve.outputs.root_tag }}
          ROOT_ASSET: ${{ steps.resolve.outputs.root_asset }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/root"
          mkdir -p "$work"

          if [ -n "$ROOT_URL" ]; then
            args=(-fL --retry 3 --retry-delay 5)
            case "$ROOT_URL" in
              https://github.com/*|https://api.github.com/*)
                args+=(-H "Authorization: Bearer $GITHUB_TOKEN") ;;
            esac
            curl "${args[@]}" "$ROOT_URL" -o "$work/root.tar.zst"
          else
            curl -fL --retry 3 --retry-delay 5 \
              "https://github.com/$ROOT_REPO/releases/download/$ROOT_TAG/$ROOT_ASSET" \
              -o "$work/root.tar.zst"
          fi

          tar --zstd -xf "$work/root.tar.zst" -C "$work"
          if [ -d "$work/build-root" ]; then
            br="$work/build-root"
          else
            br="$(find "$work" -maxdepth 1 -mindepth 1 -type d | head -1)"
          fi
          [ -n "$br" ] && [ -d "$br" ] || {
            echo "::error::the build root archive has no top-level folder"
            exit 1
          }

          for d in blur-launcher-r4 blur100-inventory native294-package268 \
                   blur100-paths6 blur100-paths6b blur100-paths7 \
                   jkflow100-engine-product blur100-wow inputs; do
            [ -e "$br/$d" ] || {
              echo "::error::build root has no $d"
              exit 1
            }
          done
          for f in amax_client_files.zip blur_12.zip dxvk-native.dxvk-cache; do
            [ -f "$br/inputs/$f" ] || {
              echo "::error::build root has no inputs/$f"
              exit 1
            }
          done

          echo "JKFLOW_BUILD_ROOT=$br" >> "$GITHUB_ENV"

      - name: Title host tests
        if: steps.resolve.outputs.mode == 'build'
        run: bash title/tests/run_title_tests.sh "$JKFLOW_BUILD_ROOT/blur-launcher-r4"

      - name: Assemble package inputs
        if: steps.resolve.outputs.mode == 'build'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: |
          set -euo pipefail
          r4="$JKFLOW_BUILD_ROOT/blur-launcher-r4"
          rm -rf "$r4/package-inputs-$VERSION" "$r4/package-view-$VERSION"
          JKFLOW_STATE_CACHE="$JKFLOW_BUILD_ROOT/inputs/dxvk-native.dxvk-cache" \
          AMAX_ZIP="$JKFLOW_BUILD_ROOT/inputs/amax_client_files.zip" \
          BLUR12_ZIP="$JKFLOW_BUILD_ROOT/inputs/blur_12.zip" \
            bash title/make_package_inputs.sh "$r4/package-inputs-$VERSION"

      - name: Build .pkg from the build root
        if: steps.resolve.outputs.mode == 'build'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          APP_VERSION: ${{ steps.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          view="$JKFLOW_BUILD_ROOT/blur-launcher-r4/package-view-$VERSION"
          PKG_NAME_VERSION="$VERSION" \
            bash title/make_pkg.sh "$view" "$RUNNER_TEMP/pkg" "$APP_VERSION"

      - name: Repack the published PKG (no build root found)
        if: steps.resolve.outputs.mode == 'repack'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          APP_VERSION: ${{ steps.resolve.outputs.app_version }}
          PKG_REPO: ${{ steps.resolve.outputs.pkg_repo }}
          PKG_TAG: ${{ steps.resolve.outputs.pkg_tag }}
          PKG_ASSET: ${{ steps.resolve.outputs.pkg_asset }}
          SOURCE_PKG_URL: ${{ vars.JKFLOW_SOURCE_PKG_URL }}
        run: |
          set -euo pipefail
          echo "::notice::No build root found. Repacking the newest published JkFlow PKG; upload a jkflow-build-root*.tar.zst release asset for a real build."

          work="$RUNNER_TEMP/repack"
          mkdir -p "$work"
          src=""
          if [ -n "$SOURCE_PKG_URL" ]; then
            echo "source pkg: $SOURCE_PKG_URL"
            curl -fL --retry 3 --retry-delay 5 "$SOURCE_PKG_URL" -o "$work/source.pkg"
            src="$work/source.pkg"
          elif [ -n "$PKG_REPO" ] && [ -n "$PKG_ASSET" ]; then
            echo "source pkg: $PKG_REPO@$PKG_TAG/$PKG_ASSET"
            curl -fL --retry 3 --retry-delay 5 \
              "https://github.com/$PKG_REPO/releases/download/$PKG_TAG/$PKG_ASSET" \
              -o "$work/$PKG_ASSET"
            src="$work/$PKG_ASSET"
          fi
          [ -n "$src" ] || {
            echo "::error::no build root and no published JkFlow-*.pkg to repack"
            exit 1
          }

          rm -rf "$work/tree"
          dotnet "$PS4_PKGTOOL" pkg_extract "$src" "$work/tree"
          view="$work/tree"
          if [ -f "$view/uroot/eboot.bin" ]; then
            view="$view/uroot"
          fi
          [ -f "$view/eboot.bin" ] || {
            echo "::error::the extracted PKG has no eboot.bin"
            exit 1
          }

          # param.sfo is a PKG header entry, not a file of the inner image, so
          # pkg_extract does not write it; pull the PARAM_SFO entry out by index.
          mkdir -p "$view/sce_sys"
          if [ ! -f "$view/sce_sys/param.sfo" ]; then
            sfo_idx="$(dotnet "$PS4_PKGTOOL" pkg_listentries "$src" \
              | awk '$NF == "PARAM_SFO" || $NF == "0x1000" { print $4; exit }')"
            [ -n "$sfo_idx" ] || {
              dotnet "$PS4_PKGTOOL" pkg_listentries "$src" >&2 || true
              echo "::error::the PKG has no PARAM_SFO entry"
              exit 1
            }
            dotnet "$PS4_PKGTOOL" pkg_extractentry "$src" "$sfo_idx" "$view/sce_sys/param.sfo"
          fi

          list="$(dotnet "$PS4_PKGTOOL" sfo_listentries "$view/sce_sys/param.sfo")"
          content_id="$(printf '%s\n' "$list" | sed -n 's/^CONTENT_ID : .* = //p' | head -1)"
          app_ver="$(printf '%s\n' "$list" | sed -n 's/^APP_VER : .* = //p' | head -1)"
          [ -n "$content_id" ] || {
            echo "::error::the extracted param.sfo has no CONTENT_ID"
            exit 1
          }
          [ -n "$app_ver" ] || app_ver="$APP_VERSION"
          echo "repack: content id $content_id, APP_VER $app_ver"

          KEEP_SFO=1 CONTENT_ID="$content_id" PKG_NAME_VERSION="$VERSION-repacked" \
            bash title/make_pkg.sh "$view" "$RUNNER_TEMP/pkg" "$app_ver"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: JkFlow-${{ steps.resolve.outputs.version }}-pkg
          path: |
            ${{ runner.temp }}/pkg/JkFlow-*.pkg
            ${{ runner.temp }}/pkg/JkFlow-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "JkFlow $VERSION" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/pkg/JkFlow-*.pkg \
            "$RUNNER_TEMP"/pkg/JkFlow-*.pkg.sha256 \
            --clobber
